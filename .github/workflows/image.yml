name: Build Docker image

on:
  release:
    types: [published]
  pull_request:
permissions:
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/neohugo/neohugo

jobs:
  docker:
    name: Build Neohugo Docker ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [latest, latest-extra]
        include:
          - variant: latest
            dockerfile: Dockerfile
            tags: |
              neohugo/neohugo:latest
              ghcr.io/${{ github.repository_owner }}/neohugo:latest
          - variant: latest-extra
            dockerfile: Dockerfile.extra
            tags: |
              neohugo/neohugo:latest-extra
              ghcr.io/${{ github.repository_owner }}/neohugo:latest-extra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: mode=max
          sbom: true
          file: ./${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HUGO_BUILD_TAGS=extended,withdeploy
