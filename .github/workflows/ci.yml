# CI and releases of neohugo (the Cargo workspace at the repository root, the neohugo binary):
# the repository's only build, test and release workflow. DEVELOPMENT.md, "CI and releases",
# says what runs when, how to cut a release and how to reproduce these jobs locally.
name: CI

on:
  push:
    branches: [main, rust-port]
    # Releases of neohugo: v<workspace version>, e.g. v0.149.0.
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

# A newer run on the same ref cancels the older one, except for release tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The toolchain CI builds with: the one the workspace is developed with. Cargo.toml's
  # rust-version (1.94) is the MSRV. A newer clippy brings new lints that -D warnings turns into
  # failures, so this moves only on purpose (DEVELOPMENT.md, "CI and releases").
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  # Caches are saved by pushes to these branches only; pull requests restore their base's.
  SAVE_CACHE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-port') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Release tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml (expected v$version)"
            exit 1
          fi

      - name: cargo fmt
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Licence check
        run: tools/neohugo/licence-check.sh

      # structdiff's self-test (§7.2): perturbations of Go's testsite output must be classified
      # correctly, and the ratchet must reject unlisted differences.
      - name: structdiff self-test
        run: python3 tools/neohugo/selftest.py

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}

      # node on PATH runs the fake-tool tests (small node scripts standing in for PostCSS,
      # Tailwind and Babel). tools/neohugo/node.sh (pinned npm ci) installs the real tools for
      # the real-tool tests and the esbuild package the next step copies the binary from; a
      # failure fails the job.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node tools
        run: |
          tools/neohugo/node.sh
          for dir in tools/neohugo/node_modules tools/neohugo/node/node_modules; do
            [ -d "$dir/.bin" ] || continue
            echo "NEOHUGO_NODE_MODULES=$GITHUB_WORKSPACE/$dir" >>"$GITHUB_ENV"
            for tool in postcss:NEOHUGO_POSTCSS_BIN tailwindcss:NEOHUGO_TAILWINDCSS_BIN babel:NEOHUGO_BABEL_BIN; do
              bin=$dir/.bin/${tool%%:*}
              if [ -x "$bin" ]; then
                echo "${tool#*:}=$GITHUB_WORKSPACE/$bin" >>"$GITHUB_ENV"
              else
                echo "::warning::tools/neohugo/node.sh installed no $bin"
              fi
            done
            exit 0
          done
          echo "::warning::tools/neohugo/node.sh ran but left no node_modules/.bin under tools/neohugo"

      # esbuild for the js_build tests (neohugo-esbuild, neohugo-resources, the gates), which
      # skip without it, so a failure here fails the job: install.sh copies the binary of the
      # esbuild package node.sh installed and checks it against the pin in
      # tools/neohugo/node/package.json.
      - name: esbuild
        run: |
          tools/esbuild/install.sh
          echo "NEOHUGO_ESBUILD_BINARY=$GITHUB_WORKSPACE/tools/esbuild/bin/esbuild" >>"$GITHUB_ENV"

      # --show-output keeps each passing test's report (parity counts, SKIPPED notes) in the log.
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast -- --show-output 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      # The steps above install every tool the tests use, so a test that prints SKIPPED lost
      # its tool: the job fails (after listing them in the summary).
      - name: Skipped tests
        if: always()
        run: |
          skipped=$(grep -h '^SKIPPED' "$RUNNER_TEMP/cargo-test.log" | sort -u || true)
          {
            echo "### Skipped tests"
            if [ -n "$skipped" ]; then
              echo '```'
              echo "$skipped"
              echo '```'
            else
              echo "None."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          echo "${skipped:-no test printed SKIPPED}"
          [ -z "$skipped" ] || { echo "::error::tests skipped (a tool is missing): see the job summary"; exit 1; }

      - name: Disk use
        if: always()
        run: |
          df -h /
          du -sh target ~/.cargo/registry 2>/dev/null || true

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Native runners only (no cross toolchains): libwebp-sys (via webp) and ring (via
        # rustls) compile C with the platform's own compiler. Linux builds on 22.04: a binary
        # linked against 24.04's glibc needs glibc 2.39 (std's weak pidfd_spawnp reference
        # still records GLIBC_2.39), one linked on 22.04 runs on glibc 2.35 and newer.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            exe: .exe
    env:
      TARGET: ${{ matrix.target }}
      BINARY: target/${{ matrix.target }}/release/neohugo${{ matrix.exe }}
      # The static MSVC runtime (cc builds the C code with /MT to match): neohugo.exe then
      # needs no Visual C++ redistributable. Applies to that target only.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # `neohugo version` (crates/cli/src/version.rs) names the commit and the vendor, as the Go
      # releases did (the vendor was their ldflags' vendorInfo); the Version step adds the date.
      NEOHUGO_BUILD_COMMIT: ${{ github.sha }}
      NEOHUGO_VENDOR_INFO: neohugo
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "::error::this runner builds for $host, not $TARGET"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ env.SAVE_CACHE }}

      # package.py reads Cargo.toml with tomllib (Python 3.11 or later; Ubuntu 22.04 has 3.10).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # BuildDate: the commit's time in UTC, RFC 3339 (Go's vcs.time). sys.stdout.write, not
      # print: Python on Windows ends a printed line with CRLF, which $(…) would keep the CR of.
      - name: Version
        run: |
          date=$(python -c 'import datetime, sys; sys.stdout.write(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$(git log -1 --format=%ct)")
          echo "NEOHUGO_BUILD_DATE=$date" >>"$GITHUB_ENV"

      - name: cargo build --release
        run: cargo build --release --locked -p neohugo --target "$TARGET"

      - name: Smoke test
        run: |
          line=$("$BINARY" version)
          echo "$line"
          case $line in
            "neohugo v"*"-$NEOHUGO_BUILD_COMMIT "*" BuildDate=$NEOHUGO_BUILD_DATE VendorInfo=$NEOHUGO_VENDOR_INFO") ;;
            *)
              echo "::error::\`neohugo version\` does not print 'neohugo v<version>-$NEOHUGO_BUILD_COMMIT <os>/<arch> BuildDate=$NEOHUGO_BUILD_DATE VendorInfo=$NEOHUGO_VENDOR_INFO'"
              exit 1
              ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            echo "needs $(objdump -T "$BINARY" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          fi

      # notices.py writes the licences of the crates linked for this target (MIT, BSD and
      # Apache-2.0 ask for them in binary distributions); it fails if a linked crate ships no
      # licence file and is not MIT. package.py writes neohugo_<version>_<os>-<arch>.tar.gz
      # (.zip for Windows) and its .sha256, after checking that `neohugo version` prints the
      # version of Cargo.toml.
      - name: Package
        run: |
          python tools/neohugo/notices.py "$TARGET" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.txt"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python tools/neohugo/package.py "$BINARY" "$TARGET" dist "$RUNNER_TEMP/THIRD_PARTY_NOTICES.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: neohugo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neohugo-*
          path: dist
          merge-multiple: true

      # The assets of the Go releases: the five archives and goreleaser's checksums file,
      # neohugo_<version>_checksums.txt ("<sha256>  <archive>" per archive). The build jobs'
      # .sha256 files check the artifacts' transfer and make that file; they are not published.
      - name: Checksums
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l
          version=${TAG#v}
          shopt -s nullglob
          archives=(neohugo_"$version"_*.tar.gz neohugo_"$version"_*.zip)
          sums=(*.sha256)
          if [ "${#archives[@]}" -ne 5 ] || [ "${#sums[@]}" -ne 5 ]; then
            echo "::error::expected 5 archives of $version and their .sha256 files, found ${#archives[@]} and ${#sums[@]}"
            exit 1
          fi
          sha256sum -c "${sums[@]}"
          LC_ALL=C sort -k 2 "${sums[@]}" >"neohugo_${version}_checksums.txt"
          rm "${sums[@]}"
          cat "neohugo_${version}_checksums.txt"

      # Idempotent: a re-run replaces the assets of the release an earlier run created. A version
      # with a pre-release suffix (e.g. 0.150.0-rc.1) makes a pre-release, never latest. Any other
      # becomes latest only if no published release has a higher version, so a patch release of an
      # older line does not take latest from a newer one (the API would make it latest).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          case $version in
            *-*) latest=(--prerelease --latest=false) ;;
            *)
              newest=$({
                gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
                  --jq '.[] | select((.isDraft or .isPrerelease) | not) | .tagName'
                echo "$TAG"
              } | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p' | sort -V | tail -n 1)
              latest=(--latest=false)
              if [ "$newest" = "$version" ]; then latest=(--latest); fi
              ;;
          esac
          {
            echo "neohugo $version, built from $GITHUB_SHA."
            echo
            echo "Each archive holds the \`neohugo\` binary, \`README.md\`, \`LICENSE\`, \`THIRD_PARTY_NOTICES.txt\` (the licences of the linked crates), \`PROVENANCE.md\` and \`THIRD_PARTY/\`."
            echo "Check a download with \`sha256sum -c neohugo_${version}_checksums.txt --ignore-missing\`."
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag "${latest[@]}" \
            --title "neohugo $version" --notes-file "$RUNNER_TEMP/notes.md"
