# See https://docs.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates#package-ecosystem
# No npm entry: the versions in tools/neohugo/node are parity pins (the tools the golden data was
# built with), not dependencies to keep current. No entry for docs/ either: its go.mod and
# package.json belong to the docs site, whose files the test fixtures record by hash.
version: 2
updates:
  # One grouped pull request for the minor and patch bumps. Several crates shape the output the
  # parity gates compare with the Go build's golden data (comrak, syntect, minify-html,
  # lightningcss, oxc, grass, image, webp, ...): the group must pass the gates of CI's Test job
  # like any change, and a bump that changes a gate's differences needs an entry in
  # tools/neohugo/changes/ (see its README).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned exactly ("=2.4.0" in Cargo.toml) on purpose, a young engine whose behaviour the
      # layouts rely on (docs/rust-port/REWRITE_PLAN.md §9, risk 3): moved by hand.
      - dependency-name: "tera"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
