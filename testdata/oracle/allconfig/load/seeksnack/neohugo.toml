# Reconstruction of the seeksnack site config (github.com/blackb1rd/seeksnack-seeksnack
# at ae6c922, private) from the decoded Go dumps in
# docs/rust-port/specs/architecture-core-data/config-{en,th,en-printzero,mounts}.json.
# Go's allconfig.LoadConfig of this file reproduces those dumps (see
# crates/nh-allconfig/PORTING.md for what the dumps cannot tell).
baseURL = "https://seeksnack.com/"
languageCode = "en"
defaultContentLanguage = "en"
title = "SeekSnack"
canonifyURLs = true
enableRobotsTXT = true
disableLanguages = ["de", "es", "fr", "ja", "nl", "pl", "pt", "zh-cn", "zh-tw"]

[build]
  [build.buildStats]
    enable = true

[imaging]
  [imaging.exif]
    disableDate = false
    disableLatLong = false
    excludeFields = ".*"
    includeFields = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    lineNos = true

[outputFormats]

[outputs]
  home = ["html", "json", "rss"]

[pagination]
  pagerSize = 12

[permalinks]
  posts = "/posts/:year/:month/:title"

[related]
  includeNewer = false
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "brands"
    weight = 80
  [[related.indices]]
    name = "companies"
    weight = 60

[server]
  [[server.redirects]]
    from = "/**"
    to = "/404.html"
    status = 404

[services]
  [services.rss]
    limit = 10

[sitemap]
  changefreq = "weekly"

[taxonomies]
  brand = "brands"
  category = "categories"
  company = "companies"
  country = "countries"
  ingredient = "ingredients"
  tag = "tags"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "node_modules"
    target = "assets/vendor"

[[menus.main]]
  name = "Snack Companies"
  url = "/companies/"
  weight = 1
[[menus.main]]
  name = "Snack Brands"
  url = "/brands/"
  weight = 2
[[menus.main]]
  name = "Snack Countries"
  url = "/countries/"
  weight = 3
[[menus.main]]
  name = "Snack Categories"
  url = "/categories/"
  weight = 4
[[menus.main]]
  name = "Snack Ingredients"
  url = "/ingredients/"
  weight = 5

[languages]
  [languages.en]
    languageName = "🇺🇸 English"
    languageCode = "en"
    weight = 1
  [languages.th]
    languageName = "🇹🇭 ไทย"
    languageCode = "th"
    weight = 2
    [languages.th.params]
      description = "ไดอารี่ของการแสวงหาขนมขบเคี้ยว"
      hometitle = "สมุดไดอารีขนมขบเคี้ยว"
      languageCode = "th"
      languageCodeOpenGraph = "th_TH"
    [[languages.th.menus.main]]
      name = "บริษัทขนม"
      url = "/companies/"
      weight = 1
    [[languages.th.menus.main]]
      name = "ยี่ห้อขนม"
      url = "/brands/"
      weight = 3
    [[languages.th.menus.main]]
      name = "ขนมของประเทศ"
      url = "/countries/"
      weight = 3
    [[languages.th.menus.main]]
      name = "ประเภทขนม"
      url = "/categories/"
      weight = 2
    [[languages.th.menus.main]]
      name = "ส่วนผสมขนม"
      url = "/ingredients/"
      weight = 4
  [languages.fr]
    languageCode = "fr"
    languageName = "Français"
    title = "avis sur les collations - SeekSnack"
    weight = 3
  [languages.pl]
    languageCode = "pl"
    languageName = "Polski"
    title = "Recenzje przekąsek - SeekSnack"
    weight = 4
  [languages.pt]
    languageCode = "pt"
