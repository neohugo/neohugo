# Disk budget (docs/rust-port/REWRITE_PLAN.md §2.2, §8.1). Build output goes to /target of the
# repository root. Agents also export CARGO_TARGET_DIR=/home/user/neohugo/target (one target dir
# shared by every worktree), CARGO_BUILD_JOBS=4 and CARGO_INCREMENTAL=0.
[build]
target-dir = "target"
jobs = 4
