[package]
name = "go-image"
version = "0.1.0"
edition = "2024"
description = "Byte-exact port of Go 1.27.1 image, image/color, image/color/palette, image/draw and image/jpeg"
license = "BSD-3-Clause"

[dependencies]

[dev-dependencies]
sha2 = "0.10"

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]

# The differential tests hash hundreds of megabytes; optimise test builds so
# `cargo test` stays fast. (Ignored once this crate joins a workspace.)
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
