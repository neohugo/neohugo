[package]
name = "go-png"
version = "0.1.0"
edition = "2024"
description = "Byte-exact port of Go 1.27.1 image/png (decoder and encoder) on top of go-image and go-flate"
license = "BSD-3-Clause"

[dependencies]
go-image = { path = "../go-image" }
go-flate = { path = "../go-flate" }
crc32fast = "1.5"

[dev-dependencies]
sha2 = "0.10"

# The differential tests decode/encode many images; optimise test builds so
# `cargo test` stays fast. (Ignored once this crate joins a workspace.)
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
