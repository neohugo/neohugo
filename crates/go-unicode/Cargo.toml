[package]
name = "go-unicode"
version = "0.1.0"
edition = "2024"
description = "Go's unicode (Unicode 17.0.0 tables from go1.27.1), unicode/utf8, unicode/utf16 and the Unicode-aware parts of strings/bytes, over byte slices"
license = "Apache-2.0"

[dependencies]
memchr = "2"

[dev-dependencies]
# Test-only: reads the gzip-compressed oracle fixtures (decompression only).
flate2 = "1"

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
