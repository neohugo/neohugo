[package]
name = "nh-hugofs"
version = "0.1.0"
edition = "2024"
description = "neohugo hugofs/*, hugolib/filesystems (BaseFs), hugolib/paths, modules (project module mounts), plus afero / bep/overlayfs / spf13/fsync semantics"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }
nh-parser = { path = "../nh-parser" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
go-path = { path = "../go-path" }

# crates.io dependencies intended (each needs a justification line in PORTING.md; README rule 2):
#   unicode-normalization (NFC of darwin file names)

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
