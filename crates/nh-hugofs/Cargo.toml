[package]
name = "nh-hugofs"
version = "0.1.0"
edition = "2024"
description = "neohugo hugofs/*, hugolib/filesystems (BaseFs), hugolib/paths, modules (project module mounts), plus afero / bep/overlayfs / spf13/fsync semantics"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }
nh-parser = { path = "../nh-parser" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
go-path = { path = "../go-path" }
go-sort = { path = "../go-sort" }
go-strconv = { path = "../go-strconv" }
go-unicode = { path = "../go-unicode" }

# crates.io: none. The darwin NFC normalization (x/text `norm.NFC`, Unicode 15.0.0) is ported in
# `nfc.rs` over tables extracted from Go (PORTING.md), so `unicode-normalization` is not needed.

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# Decompression of the gzip-compressed oracle fixtures (tests only; README rule 2 allows
# flate2 for decompression).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The test `AllProvider` names `nh_langs::language::Language` (tests only).
nh-langs = { path = "../nh-langs" }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
