[package]
name = "nh-i18n"
version = "0.1.0"
edition = "2024"
description = "neohugo langs/i18n + gohugoio/go-i18n/v2 fork (bundle, localizer, message templates, CLDR plural rules)"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-parser = { path = "../nh-parser" }
nh-langs = { path = "../nh-langs" }
nh-hugofs = { path = "../nh-hugofs" }
nh-helpers = { path = "../nh-helpers" }
nh-deps = { path = "../nh-deps" }
nh-tpl = { path = "../nh-tpl" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
gotemplate = { path = "../gotemplate" }   # (text/template for message templates)
go-fmt = { path = "../go-fmt" }
go-strconv = { path = "../go-strconv" }
go-unicode = { path = "../go-unicode" }
go-sort = { path = "../go-sort" }
go-yaml = { path = "../go-yaml" }         # (yaml.v2 Unmarshal: Hugo's yaml/yml unmarshaler)
go-json = { path = "../go-json" }         # (encoding/json Unmarshal: Hugo's json unmarshaler)
xtext-collate = { path = "../xtext-collate" }   # (x/text language: Parse, Make, Canonicalize, Parent, Base)

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# Test-only: reads the gzip-compressed Go oracle fixtures (decompression only).
flate2 = "1"
# Test-only: loads the oracle sites' configurations (allconfig.LoadConfig), as Go's testconfig does.
nh-allconfig = { path = "../nh-allconfig" }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
