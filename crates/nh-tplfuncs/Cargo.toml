[package]
name = "nh-tplfuncs"
version = "0.1.0"
edition = "2024"
description = "neohugo tpl/<namespace>/** template functions (all namespaces; seeksnack's set fully, the rest as stubs), registry, tplimplinit"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }
nh-langs = { path = "../nh-langs" }
nh-hugofs = { path = "../nh-hugofs" }
nh-helpers = { path = "../nh-helpers" }
nh-markup = { path = "../nh-markup" }
nh-resource = { path = "../nh-resource" }
nh-images = { path = "../nh-images" }
nh-page = { path = "../nh-page" }
nh-allconfig = { path = "../nh-allconfig" }
nh-tpl = { path = "../nh-tpl" }
nh-tplimpl = { path = "../nh-tplimpl" }
nh-resources = { path = "../nh-resources" }
nh-resource-transformers = { path = "../nh-resource-transformers" }
nh-parser = { path = "../nh-parser" }
nh-deps = { path = "../nh-deps" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
go-fmt = { path = "../go-fmt" }
go-json = { path = "../go-json" }
go-url = { path = "../go-url" }
go-time = { path = "../go-time" }
go-html = { path = "../go-html" }
go-strconv = { path = "../go-strconv" }
go-sort = { path = "../go-sort" }
go-unicode = { path = "../go-unicode" }
go-path = { path = "../go-path" }
goldmark = { path = "../goldmark" }
# xtext-collate = { path = "../xtext-collate" }   # (via nh-langs)

# crates.io (README rule 2; see PORTING.md): MD5, SHA-256 and SHA-512 digests.
md-5 = "0.10"
sha2 = "0.10"
# Not used: sha1 (not available offline; SHA-1 is written out in crypto.rs), base64/hex (Go's
# codecs are ported), crc32fast, regex (Go regexp is nh-common's `goregexp` port; T19 uses it
# for findRE/replaceRE).

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# Decompression of the gzip-compressed oracle fixtures (tests only; README rule 2).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The real in-memory sites of the host tests (process + assemble + freeze, as in nh-hugolib's
# own tests): a dev-dependency cycle (nh-hugolib depends on this crate); the integration tests
# link one copy of both.
nh-hugolib = { path = "../nh-hugolib" }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
