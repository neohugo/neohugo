[package]
name = "neohugo-build"
description = "Build orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-vfs.workspace = true
neohugo-site.workspace = true
neohugo-layouts.workspace = true
neohugo-render.workspace = true
neohugo-publish.workspace = true
# Phases E4–E6: `hugo_stats.json` injected as an asset, post-process placeholders, resource and
# image publishing (the image queue and the highlighter are reached through the session's
# `Handles`, so `neohugo-images` and `neohugo-highlight` need no edge of their own).
neohugo-resources.workspace = true
jiff.workspace = true
rayon.workspace = true
thiserror.workspace = true
# The structure dump (`NEOHUGO_STRUCTURE_OUT`, `structure.rs`).
serde_json.workspace = true

[dev-dependencies]
neohugo-testkit.workspace = true
tempfile.workspace = true
