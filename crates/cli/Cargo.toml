[package]
name = "neohugo"
description = "The neohugo command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[bin]]
name = "neohugo"
path = "src/main.rs"
test = false
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[features]
# The SHOULD template functions the Hugo documentation site needs (A-D2), on in the shipped
# binary: `diagrams_goat` (GoAT port) and `to_math` (KaTeX in QuickJS, rquickjs).
# `--no-default-features` builds without them; the functions then fail when called.
default = ["goat", "math"]
goat = ["neohugo-funcs/goat"]
math = ["neohugo-funcs/math"]

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-vfs.workspace = true
neohugo-site.workspace = true
neohugo-pageparser.workspace = true
neohugo-layouts.workspace = true
neohugo-funcs.workspace = true
neohugo-render.workspace = true
neohugo-build.workspace = true
neohugo-serve.workspace = true
tera.workspace = true
clap.workspace = true
anyhow.workspace = true
jiff.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
neohugo-testkit.workspace = true
# T60: the collector for A-T's `hugo_stats.json` sets, the getresource cache key for the
# embedded x/vimeo snapshots.
neohugo-publish.workspace = true
neohugo-resources.workspace = true
insta.workspace = true
tempfile.workspace = true
