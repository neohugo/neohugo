[package]
name = "tdewolff-minify-js"
version = "0.1.0"
edition = "2024"
description = "Byte-exact port of github.com/tdewolff/minify/v2@v2.23.8/js (the JavaScript minifier)"
license = "MIT"

[lib]
name = "tdewolff_minify_js"
path = "src/lib.rs"

[dependencies]
tdewolff-parse = { path = "../tdewolff-parse" }
tdewolff-parse-js = { path = "../tdewolff-parse-js" }
tdewolff-minify = { path = "../tdewolff-minify" }
go-sort = { path = "../go-sort" }
go-strconv = { path = "../go-strconv" }
go-unicode = { path = "../go-unicode" }

[dev-dependencies]
# Test-only: reads the gzip-compressed Go oracle fixtures (decompression only).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.test]
opt-level = 2

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
