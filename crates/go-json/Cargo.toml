[package]
name = "go-json"
version = "0.1.0"
edition = "2024"
description = "Go encoding/json v1 (go1.27.1) encoder/decoder over go_value::Value"
license = "BSD-3-Clause"

[dependencies]
go-value = { path = "../go-value" }
go-unicode = { path = "../go-unicode" }
go-strconv = { path = "../go-strconv" }
go-time = { path = "../go-time" }
# encoding/base64 StdEncoding for []byte values (allowed: cannot change bytes).
base64 = "0.23"

[dev-dependencies]
# Test-only: reads the gzip-compressed Go oracle fixtures (decompression only).
flate2 = "1"

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
