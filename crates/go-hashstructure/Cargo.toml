[package]
name = "go-hashstructure"
version = "0.1.0"
edition = "2024"
description = "Port of github.com/gohugoio/hashstructure v0.5.0 and neohugo common/hashing for the neohugo Rust port"
license = "MIT AND Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
go-time = { path = "../go-time" }
go-strconv = { path = "../go-strconv" }
# XXH64 (seed 0) = github.com/cespare/xxhash/v2; allowed (cannot change output bytes).
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# MD5 for hashing.MD5FromStringHexEncoded; allowed.
md-5 = "0.10"

[dev-dependencies]
# Decompression of checked-in gzip fixtures only.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
