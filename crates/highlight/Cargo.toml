[package]
name = "neohugo-highlight"
description = "Code highlighting with syntect and two-face, emitting Chroma class names (or inline styles), fence options and style CSS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-markup.workspace = true
syntect.workspace = true
two-face.workspace = true
thiserror.workspace = true

[build-dependencies]
# build.rs links two-face's syntaxes and the crate's own into one dumped set (T70).
syntect.workspace = true
two-face.workspace = true

[dev-dependencies]
# Acceptance harness (tests/it): the docs fences are read through neohugo-markup, the Chroma
# oracle fixtures are gzipped JSON.
neohugo-testkit.workspace = true
serde.workspace = true
serde_json.workspace = true
