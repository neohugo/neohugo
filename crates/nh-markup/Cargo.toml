[package]
name = "nh-markup"
version = "0.1.0"
edition = "2024"
description = "neohugo markup/**: converter + hooks API, goldmark glue (render hooks, autoid, attributes, tables, blockquotes, hugocontext, images, TOC), highlight config (+ stub highlighter), markup_config; asciidoc/pandoc/rst/org stubs"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
goldmark = { path = "../goldmark" }
go-html = { path = "../go-html" }
go-unicode = { path = "../go-unicode" }
go-strconv = { path = "../go-strconv" }
go-path = { path = "../go-path" }
# html/template's stripTags (for tpl.StripHTML in render.TextPlain).
gotemplate = { path = "../gotemplate" }

# crates.io: none. The two Go regexps (blockquote alert, hugocontext) are hand-written matchers.

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# Decompression of the gzip-compressed oracle fixtures (tests only; README rule 2 allows
# flate2 for decompression).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The language types of the `config::AllProvider` stub in tests/config.rs.
nh-langs = { path = "../nh-langs" }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
