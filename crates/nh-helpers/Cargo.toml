[package]
name = "nh-helpers"
version = "0.1.0"
edition = "2024"
description = "neohugo helpers/*, source/*, cache/filecache, cache/httpcache (+ gohugoio/httpcache + net/http response-dump subset)"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }
nh-hugofs = { path = "../nh-hugofs" }
nh-markup = { path = "../nh-markup" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
go-url = { path = "../go-url" }
go-time = { path = "../go-time" }
go-strconv = { path = "../go-strconv" }
go-path = { path = "../go-path" }
go-unicode = { path = "../go-unicode" }

# crates.io: none directly. MD5 (source.File.UniqueID) comes through nh-common's hashing
# (go-hashstructure's `md-5`, allowed by README rule 2).

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# gunzip of the fixtures (decompression only; README rule 2).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# sha256 of the cached response bodies in the tests (README rule 2).
sha2 = "0.10"
nh-langs = { path = "../nh-langs" }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
