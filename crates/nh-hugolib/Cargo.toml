[package]
name = "nh-hugolib"
version = "0.1.0"
edition = "2024"
description = "neohugo hugolib/** : HugoSites/Site/pageState, content capture, content map + assembly, content rendering + shortcodes, render loop, aliases, postProcess, build stats"
license = "Apache-2.0"

[dependencies]
go-value = { path = "../go-value" }
nh-common = { path = "../nh-common" }
nh-parser = { path = "../nh-parser" }
nh-langs = { path = "../nh-langs" }
nh-config = { path = "../nh-config" }
nh-media = { path = "../nh-media" }
nh-hugofs = { path = "../nh-hugofs" }
nh-markup = { path = "../nh-markup" }
nh-transform = { path = "../nh-transform" }
nh-tpl = { path = "../nh-tpl" }
nh-helpers = { path = "../nh-helpers" }
nh-resource = { path = "../nh-resource" }
nh-images = { path = "../nh-images" }
nh-page = { path = "../nh-page" }
nh-doctree = { path = "../nh-doctree" }
nh-allconfig = { path = "../nh-allconfig" }
nh-tplimpl = { path = "../nh-tplimpl" }
nh-resources = { path = "../nh-resources" }
nh-resource-transformers = { path = "../nh-resource-transformers" }
nh-esbuild = { path = "../nh-esbuild" }
nh-publisher = { path = "../nh-publisher" }
nh-deps = { path = "../nh-deps" }
nh-i18n = { path = "../nh-i18n" }
nh-tplfuncs = { path = "../nh-tplfuncs" }

# Wave A crates. Uncommented = landed in git and passing `cargo check`; uncomment the others (only)
# once their crate has landed (HUGO_LAYER.md §1 rule 4):
go-json = { path = "../go-json" }
go-time = { path = "../go-time" }
go-fmt = { path = "../go-fmt" }
go-path = { path = "../go-path" }
go-sort = { path = "../go-sort" }
go-strconv = { path = "../go-strconv" }
go-unicode = { path = "../go-unicode" }

[dev-dependencies]
# Fixture reader for the Go-oracle JSON fixtures (tests only; never in parity paths).
serde_json = "1"
# gunzip of the Go-oracle fixtures (decompression only; README rule 2).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Temporary: each crate is its own workspace while crates are ported in parallel.
[workspace]
