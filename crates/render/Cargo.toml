[package]
name = "neohugo-render"
description = "The render Session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-vfs.workspace = true
neohugo-site.workspace = true
neohugo-page.workspace = true
neohugo-view.workspace = true
neohugo-layouts.workspace = true
neohugo-funcs.workspace = true
neohugo-markup.workspace = true
# `AliasPlan` is neohugo-nav's (T24).
neohugo-nav.workspace = true
# The resource store the views register bundle files in (T33).
neohugo-resources.workspace = true
# T34: shortcodes (the lexer and assembler), the site functions (`Handles`, `register`; T35
# fills them), code fences no hook handles, and what `Handles` holds.
neohugo-pageparser.workspace = true
neohugo-sitefuncs.workspace = true
neohugo-highlight.workspace = true
neohugo-images.workspace = true
neohugo-locale.workspace = true
dashmap.workspace = true
tera.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
neohugo-testkit.workspace = true
serde_json.workspace = true
sha2.workspace = true
