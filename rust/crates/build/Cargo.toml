[package]
name = "neohugo-build"
description = "Build orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-render.workspace = true
neohugo-publish.workspace = true
neohugo-resources.workspace = true
neohugo-images.workspace = true
neohugo-highlight.workspace = true
neohugo-esbuild.workspace = true
# planned third-party dependencies (T00); the owning task adjusts them
rayon.workspace = true
tracing.workspace = true
thiserror.workspace = true
