[package]
name = "neohugo-build"
description = "Build orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-vfs.workspace = true
neohugo-site.workspace = true
neohugo-layouts.workspace = true
neohugo-render.workspace = true
neohugo-publish.workspace = true
# T38 (walking skeleton) dropped the planned `neohugo-resources`, `neohugo-images`,
# `neohugo-highlight` and `neohugo-esbuild` edges: the skeleton publishes no resources, processes
# no images and highlights nothing. T36 adds them back.
jiff.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
neohugo-testkit.workspace = true
tempfile.workspace = true
