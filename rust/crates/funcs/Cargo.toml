[package]
name = "neohugo-funcs"
description = "The template API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[features]
math = ["dep:pulldown-latex"]
goat = ["dep:svgbob"]

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-locale.workspace = true
# planned third-party dependencies (T00); the owning task adjusts them
tera.workspace = true
tera-contrib.workspace = true
regex.workspace = true
serde_json.workspace = true
toml.workspace = true
serde-saphyr.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
url.workspace = true
html5gum.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
pulldown-latex = { workspace = true, optional = true }
svgbob = { workspace = true, optional = true }
