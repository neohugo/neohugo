# Reviewed differences between neohugo-config and the Go oracle (allconfig/load).
# Keys: a case name (every difference of that case) or the first line of one difference.
# The acceptance cases (repo/*, seeksnack/*) must not appear here. See README.md, "Accepted
# deviations", for the reasoning behind each group.

[load]
# (1) Theme configuration is not merged: the plan's A1 pipeline has no theme layer (themes are
#     mounts, §3.1 A2). Every case below configures `theme` with a hugo.toml of its own.
"merge/defaults" = "theme config not merged"
"merge/params-none" = "theme config not merged"
"merge/params-shallow" = "theme config not merged"
"merge/root-deep" = "theme config not merged"
"merge/root-shallow" = "theme config not merged"
"merge/menus-none" = "theme config not merged"
"merge/menus-deep" = "theme config not merged"
"merge/taxonomies-deep" = "theme config not merged"
"merge/languages-deep" = "theme config not merged"
"merge/invalid-strategy" = "theme config not merged"
"themes/one" = "theme config not merged"
"themes/config-dir" = "theme config not merged"
"themes/nested-imports" = "theme config not merged"
"themes/themes-dir" = "theme config not merged"
"themes/replacements" = "theme config not merged"
"themes/vendored" = "theme config not merged"
"themes/theme-outputs-transient" = "theme config not merged (the theme defines the output format)"
"themes/missing" = "theme lookup is the file system layer's (vfs, T20)"
"themes/relative-outside" = "theme lookup is the file system layer's (vfs, T20)"
"themes/nested-relative-outside" = "theme lookup is the file system layer's (vfs, T20)"
"themes/vendored-invalid" = "modules.txt is not read (no Hugo Modules)"
"env/module-workspace-missing" = "no Hugo Modules: module.workspace is not checked"
"sections/module-replacements-invalid" = "no Hugo Modules: module.replacements is not checked"

# (2) Project-wide settings come from the default language. Go keeps imaging, media types and
#     output formats per language; neohugo has one table of each per project.
"languages/per-language-sections [en] imaging:" = "imaging is project-wide"
"merge/imaging-root-and-lang" = "imaging is project-wide"
"merge/lang-mediatypes" = "media types and output formats are project-wide"

# (3) Sections that are not typed here: deployment (hugo deploy is not ported), segments,
#     httpCache (owned by the resources crate when GetRemote polling lands).
"sections/segments-invalid-glob" = "segments not typed"
"sections/segments-invalid-type" = "segments not typed"
"sections/deployment-empty-target" = "deployment not typed"
"sections/deployment-empty-matcher" = "deployment not typed"
"sections/deployment-bad-pattern" = "deployment not typed"
"sections/deployment-bad-order" = "deployment not typed"
"sections/deployment-bad-glob" = "deployment not typed"
"sections/httpcache-invalid" = "httpCache not typed"
"sections/imaging-invalid-filter" = "resample filter names are validated by the images crate (T41)"

# (4) Deliberate behaviour differences.
"basic/empty-dir" = "load requires a configuration file or directory (Go defers the check to the CLI)"
"basic/filename-missing" = "a missing --config file is an error (Go falls back to defaults)"
"basic/clock-invalid" = "--clock is not configuration (base::Clock, parsed by the CLI)"
"basic/cache-dir-no-xdg" = "the cache directory is not created while loading; the oracle's XDG_CACHE_HOME parent was not a directory, which the fixture does not record"
"env/decoder-not-map" = "HUGO_SITEMAP=weekly is an error (a table is expected); Go ignores it"
"env/security [en] security:" = "HUGO_* lists written as ['a'] are parsed as lists; Go keeps the literal string as one pattern"
"languages/lang-overrides-root-scalars" = "disableLanguages inside a language table is ignored (a root-only setting)"
"sections/media-types [en] mediatypes:" = "the oracle dump shows the configured table; the decoded delimiter of a type with suffixes defaults to '.'"
"sections/caches-invalid-maxage" = "maxAge accepts a number of seconds written as a string"
"sections/caches-invalid" = "a cache that is not a table is an error; Go ignores it"
