[package]
name = "neohugo-images"
description = "Image processing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
image.workspace = true
fast_image_resize.workspace = true
webp.workspace = true
kamadak-exif.workspace = true
imageproc.workspace = true
jiff.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
# Planned (T00), not used yet; kept so that Cargo.lock keeps them: ab_glyph (images.Text),
# qrcode (qr_code) and smartcrop2 (smart anchor) are COULD features (T72); color_quant and
# kmeans_colors are for `.Colors` (README, "Not ported yet").
ab_glyph.workspace = true
qrcode.workspace = true
color_quant.workspace = true
kmeans_colors.workspace = true
smartcrop2.workspace = true

[dev-dependencies]
neohugo-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
