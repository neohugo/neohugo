[package]
name = "neohugo-sitefuncs"
description = "Site-bound Tera functions as small handle structs (get_page, ref, i18n, assets, images, paginate, partial, …)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it (one test binary, REWRITE_PLAN.md §2.2)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
neohugo-workspace-hack.workspace = true
neohugo-base.workspace = true
neohugo-config.workspace = true
neohugo-view.workspace = true
neohugo-funcs.workspace = true
neohugo-resources.workspace = true
neohugo-locale.workspace = true
neohugo-site.workspace = true
neohugo-page.workspace = true
neohugo-nav.workspace = true
neohugo-images.workspace = true
# `partial()` / `template_exists` look templates up; `execute_as_template` renders with the
# build's Tera instance (`Handles::templates`).
neohugo-layouts.workspace = true
# The `highlight` filter (site `[markup.highlight]` defaults).
neohugo-highlight.workspace = true
# `page_toc` in the content phase: the TOC of the fragments stage (T36; already a dependency of
# `neohugo-view`).
neohugo-markup.workspace = true
dashmap.workspace = true
tera.workspace = true
thiserror.workspace = true
serde_json.workspace = true
jiff.workspace = true
# `unmarshal` of CSV and XML (the same readers as `site.data`).
csv.workspace = true
roxmltree.workspace = true

[dev-dependencies]
neohugo-testkit.workspace = true
neohugo-vfs.workspace = true
tempfile.workspace = true
